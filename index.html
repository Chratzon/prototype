<!doctype html>
<html lang="de" class="pwa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-PWA-START-->
<meta name="theme-color" content="#0E6E5C">
<meta name="description" content="doorku: Türliste, Grundrisse mit Pins und lückenlose Historie für Türelemente.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="doorku">
<!--HEAD-PWA-END-->
<title>doorku Türendokumentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: App-Shell mit Kopfleiste. Handy: ein Bereich + Bottom-Nav. Tablet (ab 820px): Türliste links, rechts Detail/Plan/Tabelle. */
:root{
  --petrol:#0E6E5C; --petrol-dark:#0A4F42; --petrol-soft:#E4F3EF; --petrol-text:#0E6E5C;
  --coral:#FF7A50; --coral-soft:#FFE7DE; --coral-text:#B8471F;
  --amber-soft:#FBEFD5; --amber-text:#83560A;
  --ink:#1E2422; --muted:#6B7570; --line:#D8DDD9; --paper:#F7F6F2; --surface:#FFFFFF; --surface-2:#EFEEE9;
  --plan-bg:#E6E5DF; --scrim:rgba(20,26,24,.42);
  --shadow:0 1px 2px rgba(30,36,34,.06),0 10px 28px rgba(30,36,34,.10);
  --f-head:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ui:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --petrol-soft:#173A33; --petrol-text:#6CCBB2; --coral-soft:#3B241B; --coral-text:#FF9F80;
    --amber-soft:#382D13; --amber-text:#E9C46F;
    --ink:#E7ECEA; --muted:#9BA6A1; --line:#2D3633; --paper:#111614; --surface:#1A201E; --surface-2:#232B28;
    --plan-bg:#0B0F0E; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --petrol-soft:#173A33; --petrol-text:#6CCBB2; --coral-soft:#3B241B; --coral-text:#FF9F80;
  --amber-soft:#382D13; --amber-text:#E9C46F;
  --ink:#E7ECEA; --muted:#9BA6A1; --line:#2D3633; --paper:#111614; --surface:#1A201E; --surface-2:#232B28;
  --plan-bg:#0B0F0E; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}

/* Kopfleiste */
.topbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-left,0px)) 10px max(14px,env(safe-area-inset-right,0px));min-width:0}
.pwa .topbar{padding-top:max(10px,env(safe-area-inset-top,0px))}
.logo{width:34px;height:34px;flex:0 0 auto;display:block}
.projbtn{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:4px 8px;border-radius:10px;text-align:left}
.projbtn:hover{background:var(--surface-2)}
.projbtn .pn{font-family:var(--f-head);font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px;max-width:100%}
.projbtn .pn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projbtn .ps{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.spacer{flex:1}
.offline{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--amber-text);background:var(--amber-soft);padding:3px 8px;border-radius:20px}
.userpill{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:30px;background:var(--surface)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--petrol);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.02em;flex:0 0 auto}
.userpill .un{font-size:13px;font-weight:500;white-space:nowrap}
@media (max-width:480px){.userpill{padding:3px}.userpill .un{display:none}}

/* Bottom-Nav (Handy) */
.bottomnav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-left,0px)) 4px max(8px,env(safe-area-inset-right,0px))}
.pwa .bottomnav{padding-bottom:max(4px,env(safe-area-inset-bottom,0px))}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11.5px;font-weight:500;color:var(--muted);border-radius:10px}
.navbtn svg{width:24px;height:24px}
.navbtn[aria-current="page"]{color:var(--petrol-text)}
.navbtn[aria-current="page"] .ni{background:var(--petrol-soft)}
.ni{padding:2px 16px;border-radius:20px;display:grid;place-items:center}

main{min-height:0;position:relative;overflow:hidden}
.view{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}

/* Split-Layout (Tablet) */
.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;height:100%}
.split > aside{border-right:1px solid var(--line);min-width:0;min-height:0;background:var(--paper)}
.split > section{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr;background:var(--paper)}
.segbar{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{padding:6px 16px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pane{min-height:0;position:relative;overflow:hidden}

/* Werkzeugleiste, Suche, Chips */
.toolbar{position:sticky;top:0;z-index:2;background:var(--paper);padding:12px 16px 10px;display:grid;gap:10px;border-bottom:1px solid transparent}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip .cnt{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}
.chip[aria-pressed="true"] .cnt{color:rgba(255,255,255,.75)}
.chip.add{border-style:dashed;color:var(--petrol-text);border-color:var(--petrol-text)}

/* Türkarten */
.cards{display:grid;gap:8px;padding:4px 16px 96px}
.card{display:grid;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%}
.card:hover{border-color:var(--muted)}
.card[aria-current="true"]{border-color:var(--petrol);box-shadow:0 0 0 1px var(--petrol)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nr{font-family:var(--f-head);font-weight:700;font-size:12.5px;letter-spacing:.03em;color:var(--petrol-text);font-variant-numeric:tabular-nums}
.card-title{font-weight:600;font-size:15px}
.card-meta{font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.badge.fire{background:var(--ink);color:var(--surface)}
.badge.due{background:var(--coral-soft);color:var(--coral-text)}
.badge.soon{background:var(--amber-soft);color:var(--amber-text)}
.badge.nopin{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.badge.urgent{background:var(--coral);color:#fff}
.badge.high{background:var(--amber-soft);color:var(--amber-text)}
.badge.low{background:transparent;border:1px solid var(--line);color:var(--muted)}
.sortrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.seg.small button{padding:4px 12px;font-size:12.5px}

/* Übersicht (Dashboard) */
.dash{padding:16px 16px 48px;max-width:1180px;margin:0 auto;display:grid;gap:16px}
.dtitle h2{font-size:22px}
.dtitle .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .v{font-family:var(--f-head);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.alert .v{color:var(--coral-text)}
.kpi.warn .v{color:var(--amber-text)}
.kpi.ok .v{color:var(--petrol-text)}
.dgrid{display:grid;gap:16px;align-items:start}
@media (min-width:900px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .full{grid-column:1/-1}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.panel > h3{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--petrol-text);font-family:var(--f-ui);padding:14px 14px 10px;display:flex;justify-content:space-between;gap:8px}
.panel > h3 .cnt{color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500}
.pempty{padding:4px 14px 16px;color:var(--muted);font-size:13.5px}
.ditem{display:grid;grid-template-columns:1fr auto;align-items:start;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.ditem:hover{background:var(--surface-2)}
.ditem .t1{font-weight:600;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.ditem .t1 .nr{margin-right:6px;white-space:nowrap}
.ditem .t2{font-size:13px;color:var(--muted);grid-column:1;min-width:0;overflow-wrap:anywhere}
.ditem .side{grid-row:1/span 2;grid-column:2;text-align:right;font-size:13px;font-weight:600;white-space:nowrap}
.ditem .side.late{color:var(--coral-text)}
.ditem .side.near{color:var(--amber-text)}
.ditem .side .d{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ditem .badges{grid-column:1;margin-top:3px}
.more{display:block;padding:9px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.projcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;padding:0 14px 14px}
.pcard{display:grid;gap:6px;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);width:100%}
.pcard:hover{border-color:var(--muted)}
.pcard .r1{font-weight:600;display:flex;align-items:center;gap:10px}
.pcard .r2{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--petrol)}
.homelink{margin-right:auto}
.segbar{align-items:center}
.block h3 .cnt{color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500;margin-left:6px}
.param.miss{background:var(--amber-soft)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.file{display:grid;gap:4px;text-align:left;font-size:12.5px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface);min-width:0}
.file img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:#fff}
.file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file.add{place-items:center;align-content:center;min-height:120px;border-style:dashed;color:var(--petrol-text);text-align:center}
.file.add svg{width:22px;height:22px}
.file.add span{white-space:normal}
.fileview{background:var(--plan-bg);border-radius:12px;padding:8px;max-height:60vh;overflow:auto}
.fileview img{display:block;width:100%;height:auto;background:#fff}
.parts{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.pgroup .parts{border:0;border-radius:0;border-top:1px solid var(--line)}
.part{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;border-top:1px solid var(--line)}
.part:first-child{border-top:0}
.part .pn{flex:1;min-width:0;font-size:14px}
.part .qty{color:var(--muted);font-size:13px}
.iconbtn.sm{width:30px;height:30px}.iconbtn.sm svg{width:16px;height:16px}
.pt-offen{background:var(--surface-2);color:var(--muted)}
.pt-bestellt{background:var(--amber-soft);color:var(--amber-text)}
.pt-geliefert{background:var(--petrol-soft);color:var(--petrol-text)}
.pt-montiert{background:var(--petrol);color:#fff}
.pghead{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px}
.pgt{flex:1;min-width:0;text-align:left;font-weight:600}
.pgt .r2{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.linkbtn{color:var(--petrol-text);font-weight:600;text-decoration:underline}
.muted{color:var(--muted)}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.cond{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500}
.cond[aria-checked="true"].c-gut{background:var(--petrol);border-color:var(--petrol);color:#fff}
.cond[aria-checked="true"].c-gebrauchsspuren{background:var(--surface-2);border-color:var(--muted)}
.cond[aria-checked="true"].c-pflegebeduerftig{background:var(--amber-soft);border-color:var(--amber-text);color:var(--amber-text)}
.cond[aria-checked="true"].c-mangelhaft{background:var(--coral);border-color:var(--coral);color:#fff}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-top:1px solid var(--line)}
.mrow .mt{flex:1;min-width:0;display:grid;gap:2px;text-align:left}
.mrow .t1{font-weight:600;font-size:14.5px}
.mrow .t2{font-size:13px;color:var(--muted)}
.mrow .badges{margin-top:2px}
@media (max-width:480px){.hide-s{display:none}.navbtn{font-size:10.5px}.ni{padding:2px 10px}}
.ph-planung{background:var(--surface-2);color:var(--muted)}
.ph-bau{background:var(--amber-soft);color:var(--amber-text)}
.ph-nutzung{background:var(--petrol-soft);color:var(--petrol-text)}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.phase{display:grid;gap:2px;align-content:start;text-align:left;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.phase:hover{border-color:var(--muted)}
.phase[aria-checked="true"]{border-color:var(--petrol);background:var(--petrol-soft)}
.phase .pi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.phase[aria-checked="true"] .pi{background:var(--petrol);color:#fff}
.phase .pt{font-weight:600;font-size:14px;margin-top:4px}
.phase .ph{font-size:12px;color:var(--muted);line-height:1.35}

/* Dokumente und Anbauteile */
.segbar{flex-wrap:wrap}
.sortrow{flex-wrap:wrap}
.toolbar.static{position:static}
.projicon svg{width:20px;height:20px}
.doclist{display:grid;gap:8px;padding:0 14px 14px}
.docrow{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0}
.docrow:hover{border-color:var(--muted)}
.docthumb{width:44px;height:58px;flex:0 0 auto;border-radius:5px;border:1px solid var(--line);background:#fff;object-fit:cover;object-position:top;display:block}
.docthumb.sm{width:32px;height:42px}
.docrow .dt{flex:1;min-width:0;display:grid;gap:2px}
.docrow .t1{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.docrow .t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.docrow .badges{margin-top:2px}
.dc-zulassung{background:var(--petrol-soft);color:var(--petrol-text)}
.dc-datenblatt{background:var(--surface-2);color:var(--ink)}
.dc-pruefbuch{background:var(--amber-soft);color:var(--amber-text)}
.dc-ue{background:var(--coral-soft);color:var(--coral-text)}
.dc-sonstiges{background:var(--surface-2);color:var(--muted)}
.dgroup{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.dgroup:first-child{margin-top:0}
.pick .check{visibility:hidden;flex:0 0 auto}
.pick[aria-checked="true"]{border-color:var(--petrol);background:var(--petrol-soft)}
.pick[aria-checked="true"] .check{visibility:visible}
.pick[aria-checked="mixed"]{border-color:var(--petrol);border-style:dashed}
.pick[aria-checked="mixed"] .check{visibility:visible;opacity:.45}
.pickbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pickbar .search{flex:1;min-width:180px}
.links{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.linkrow{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 10px;border-top:1px solid var(--line);min-width:0}
.linkrow:first-child{border-top:0}
.linkrow .lt{flex:1;min-width:0;text-align:left;display:grid;gap:1px}
.linkrow .t1{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.linkrow .t2{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.sub2{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.dochead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.dochead .docprev img{width:96px;height:128px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.dochead h2{margin-top:6px;overflow-wrap:anywhere}
.field input[type=file]{height:auto;padding:8px 11px}
/* Erfassungstabelle (Türliste in Tabellenform) */
.grid table{min-width:0;width:max-content}
.grid th{border-right:1px solid var(--line)}
.grid td{padding:0;border-right:1px solid var(--line)}
.grid td input,.grid td select{border:0;background:transparent;height:38px;padding:0 10px;width:100%;min-width:96px;font-size:13.5px;border-radius:0}
.grid td input:focus,.grid td select:focus{outline:2px solid var(--petrol);outline-offset:-2px;background:var(--surface)}
.grid td.c-nr input{font-family:var(--f-head);font-weight:700;color:var(--petrol-text);min-width:100px}
.grid td.c-name input,.grid td.c-room input{min-width:150px}
.grid td.c-width input,.grid td.c-height input{min-width:76px}
.grid td.c-item input{min-width:170px}
.grid td.cb,.grid th.cb{width:40px;text-align:center}
.grid td.cb input{width:18px;height:18px;min-width:0;accent-color:var(--petrol)}
.grid td.c-docs{padding:0 6px}
.grid td.c-docs .btn{height:30px;font-size:13px;padding:0 10px}
.grid tbody tr{cursor:default}
.grid tbody tr:hover td{background:transparent}
.grid tbody tr.sel td{background:var(--petrol-soft)}
.grid th.item{color:var(--petrol-text)}
.bulkbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border-radius:12px;padding:8px 8px 8px 14px;font-size:13.5px}
.bulkbar b{margin-right:auto}
.bulkbar .btn{height:32px;font-size:13px;background:var(--surface);color:var(--ink);border-color:transparent}

/* Status-Tags */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-geplant{background:var(--surface-2);color:var(--muted)}
.s-pruefung{background:var(--amber-soft);color:var(--amber-text)}
.s-offen{background:var(--coral-soft);color:var(--coral-text)}
.s-erledigt{background:var(--petrol-soft);color:var(--petrol-text)}

.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:6px}

/* FAB */
.fab{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:18px;z-index:5;height:54px;min-width:54px;padding:0 18px;border-radius:28px;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(255,122,80,.38)}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.97)}

/* Detail */
.detail{padding:0 0 60px;max-width:860px}
.dhead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:16px 16px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.dhead h2{font-size:22px;line-height:1.2;margin-top:2px}
.dhead .meta{color:var(--muted);font-size:13.5px;margin-top:3px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.tagbtn{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tagbtn .hint{font-size:11px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff}
.btn.primary:hover{background:var(--petrol-dark)}
.btn.accent{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--coral-text)}
.block{padding:18px 16px 4px}
.block h3{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--petrol-text);margin-bottom:10px;font-family:var(--f-ui)}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0}
.param{background:var(--surface);padding:10px 12px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.param dt{font-size:12px;color:var(--muted);margin-bottom:2px}
.param dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.param dd.empty-val{color:var(--muted);font-weight:400}

/* Formulare */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 11px;width:100%;min-width:0;font-size:15px}
.field textarea{height:auto;min-height:74px;padding:10px 11px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-soft)}
.field.changed input,.field.changed select{border-color:var(--coral)}
.formbar{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.editing-note{font-size:13px;color:var(--muted);margin:-4px 0 12px}

/* Historie */
.composer{display:flex;gap:8px;margin-bottom:14px}
.composer input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
.timeline{list-style:none;margin:0;padding:0 0 0 4px;display:grid;gap:0}
.tl{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--petrol);margin-top:4px;box-shadow:0 0 0 3px var(--paper)}
.dot.change{background:var(--coral)}
.dot.status{background:var(--amber-text)}
.dot.note{background:var(--surface);border:2px solid var(--petrol)}
.dot.service{background:var(--petrol-dark)}
.tl .tt{font-size:14.5px;overflow-wrap:anywhere}
.tl .tm{font-size:12px;color:var(--muted);margin-top:1px}
.tl .kind{font-weight:600}

/* Plan */
.planview{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.planbar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.planbar .chips{flex:1;min-width:0}
.stage{position:relative;min-height:0;background:var(--plan-bg);overflow:hidden}
.vp{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.canvas{position:relative;margin:16px;background:#fff;box-shadow:var(--shadow);border-radius:4px;transform-origin:0 0}
.canvas img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;border-radius:4px}
.canvas.placing{cursor:crosshair;outline:3px dashed var(--coral);outline-offset:3px}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:2}
.pin svg{width:26px;height:33px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28));transition:transform .12s}
.pin .pl{font-family:var(--f-head);font-size:10px;font-weight:700;color:#1E2422;background:rgba(255,255,255,.92);padding:0 5px;border-radius:5px;margin-top:-2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pin[aria-current="true"] svg{transform:scale(1.25)}
.pin[aria-current="true"] .pl{background:#1E2422;color:#fff}
.pin.ghost{pointer-events:none;opacity:.85}
.zoom{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:16px;z-index:4;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.zoom button{width:42px;height:40px;display:grid;place-items:center;font-size:20px;font-weight:500}
.zoom button+button{border-top:1px solid var(--line)}
.zoom svg{width:18px;height:18px}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--surface);padding:8px 8px 8px 14px;border-radius:30px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.banner button{background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.ticket{position:absolute;left:12px;right:12px;bottom:12px;z-index:7;max-width:420px;margin-left:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.ticket .th{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 8px}
.ticket .th > div{flex:1;min-width:0}
.ticket h3{font-size:17px;margin-top:1px}
.ticket .rows{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:4px 14px 12px;font-size:13.5px}
.ticket .rows dt{color:var(--muted)}
.ticket .rows dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.ticket .tb{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.ticket .tb .btn{flex:1;justify-content:center}
.planempty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.planempty h3{color:var(--ink);margin-bottom:6px}
.planempty .btn{margin-top:14px}

/* Tabelle */
.tablewrap{padding:0 16px 40px}
.tfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tfilters select{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-size:13.5px}
.tfilters .count{margin-left:auto;font-size:13px;color:var(--muted)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th button{display:inline-flex;align-items:center;gap:4px;font-weight:600}
th button[data-dir]::after{content:attr(data-dir);color:var(--petrol-text)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:160px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}

/* Sheets */
#overlay{position:fixed;inset:0;z-index:50;display:none}
#overlay.open{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .15s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:19px;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.sheet h3{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--petrol-text);margin:20px 0 8px;font-family:var(--f-ui)}
@media (min-width:820px){
  .sheet{left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);width:min(520px,92vw);max-height:84vh;border-radius:18px;padding:18px 22px 22px;animation:pop .18s ease-out}
  .sheet .grab{display:none}
}
.rowlist{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-align:left;width:100%;background:var(--surface)}
.row:hover{border-color:var(--muted)}
.row[aria-checked="true"]{border-color:var(--petrol);background:var(--petrol-soft)}
.row .rt{flex:1;min-width:0}
.row .r1{font-weight:600}
.row .r2{font-size:13px;color:var(--muted)}
.row .check{width:20px;height:20px;color:var(--petrol-text)}
.projicon{width:36px;height:36px;border-radius:10px;background:var(--petrol-soft);color:var(--petrol-text);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-12px);z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.installbar{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-left,0px)) 10px max(14px,env(safe-area-inset-right,0px));background:var(--petrol-soft);border-top:1px solid var(--line);font-size:13.5px}
.installbar .it{flex:1;min-width:0}
.installbar b{font-family:var(--f-head)}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button data-act="home" aria-label="Übersicht" title="Übersicht"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect x="4" y="4" width="92" height="92" rx="22" fill="#0E6E5C"/><g transform="rotate(-7 34 50)"><rect x="30" y="17" width="36" height="66" rx="5" fill="#fff"/><circle cx="59" cy="50" r="3.6" fill="#0E6E5C"/></g></svg></button>

</div>

<script>
'use strict';
/* ---------- Konstanten ---------- */
const STATUS={geplant:'Geplant',pruefung:'In Prüfung',offen:'Offen',erledigt:'Erledigt'};

const TYPES=['Drehflügeltür 1-flg.','Drehflügeltür 2-flg.','Rohrrahmentür','Schiebetür','Pendeltür','Tor'];

const PRIOS=['Dringend','Hoch','Normal','Niedrig'];
const PHASES={planung:'Planung',bau:'Bauphase',nutzung:'Nutzung'};

const CONDS=['Gut','Gebrauchsspuren','Pflegebedürftig','Mangelhaft'];
const PART_STATES=['offen','bestellt','geliefert','montiert'];

const PART_SUGGEST=['Türblatt','Zarge','Bänder','Schloss','Drückergarnitur','Profilzylinder','Obentürschließer','Feststellanlage','Bodendichtung','Schließfolgeregler','Panikbeschlag','E-Öffner','Türstopper'];
// Dokumente für die Übergabe an den Bauherrn; jedes Dokument kann beliebig vielen Türen und Anbauteilen zugeordnet sein
const DOC_ORDER=['zulassung','ue','pruefbuch','datenblatt','sonstiges'];
const DOC_CAT={zulassung:'Zulassung',datenblatt:'Datenblatt',pruefbuch:'Prüfbuch',ue:'Übereinstimmungserklärung',sonstiges:'Sonstiges'};

const ITEM_CATS=['Obentürschließer','Feststellanlage','Schließfolgeregler','Schloss','Panikbeschlag','Drückergarnitur','Profilzylinder','Bänder','E-Öffner','Bodendichtung','Türstopper','Zutrittskontrolle','Sonstiges'];
// Spalten der Erfassungstabelle (Türliste in Tabellenform), danach folgen die Anbauteil-Spalten
const GRID_F=['nr','name','floor','room','type','fire','width','height','maker'];
// Kernangaben, die in der Planung je Tür vorliegen sollten
const PLAN_KEYS=['type','fire','width','height','maker','hardware'];
function completeness(d){
  const missing=PLAN_KEYS.filter(k=>d[k]===''||d[k]==null).map(k=>FIELDS.find(f=>f.k===k).l);
  return {n:PLAN_KEYS.length-missing.length,of:PLAN_KEYS.length,missing};
}
function defaultParts(d){
  const two=/2-flg/.test(d.type||''),slide=/Schiebe/.test(d.type||'');
  const l=[[two?'Türblatt (Gang- und Standflügel)':'Türblatt',1],['Zarge',1]];
  if(!slide)l.push(['Bänder',two?6:3],['Schloss',1],['Drückergarnitur',1],['Profilzylinder',1]);
  else l.push(['Laufschiene',1],['Griffmuschel',2]);
  if(d.fire&&d.fire!=='ohne')l.push(['Obentürschließer',two?2:1]);
  if(two&&d.fire&&d.fire!=='ohne')l.push(['Schließfolgeregler',1]);
  if(/RS/.test(d.fire||''))l.push(['Bodendichtung',two?2:1]);
  return l.map(([name,qty])=>({id:uid(),name,qty,state:'offen'}));
}

const PRIO_RANK={Dringend:0,Hoch:1,Normal:2,Niedrig:3};
// g:'task' = Felder der offenen Aufgabe (Ticket), werden im Detail separat über den Parametern gezeigt
const FIELDS=[
  {k:'task',l:'Aufgabe / Mangel',g:'task'},
  {k:'prio',l:'Priorität',opts:PRIOS,g:'task'},
  {k:'due',l:'Frist',t:'date',g:'task'},
  {k:'nr',l:'Tür-Nr.'},
  {k:'name',l:'Bezeichnung'},
  {k:'floor',l:'Geschoss'},
  {k:'room',l:'Raum / Standort'},
  {k:'type',l:'Türtyp',opts:TYPES},
  {k:'fire',l:'Brandschutzklasse',opts:FIRE},
  {k:'maker',l:'Hersteller'},
  {k:'width',l:'Breite (mm)',t:'number'},
  {k:'height',l:'Höhe (mm)',t:'number'},
  {k:'year',l:'Baujahr',t:'number'},
  {k:'hardware',l:'Beschlag / Schließung'},
  {k:'interval',l:'Wartungsintervall (Monate)',t:'number'},
  {k:'lastService',l:'Letzte Wartung',t:'date'},
];
const ICON={
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>',
  plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 4h18v16H3z"/><path d="M3 11h7m4 0h7M12 4v4m0 4v8"/></svg>',
  table:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14.5h18M9 9v11"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0 5 5L11 20a2.1 2.1 0 0 1-3-3l8.5-8.5"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  check:'<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',

const fmtDate=s=>{if(!s)return '';const d=new Date(s.length===10?s+'T12:00:00':s);return isNaN(d)?s:d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});};
const fmtDateTime=s=>{const d=new Date(s);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';};
const initials=n=>n.split(/\s+/).map(p=>p[0]).join('').slice(0,2).toUpperCase();

function nextService(d){
  if(!d.lastService||!d.interval)return null;
  const t=new Date(d.lastService+'T12:00:00');t.setMonth(t.getMonth()+Number(d.interval));return t;
}
// Wartungen werden erst in der Projektphase „Nutzung“ überwacht
const inUse=d=>(S.projects.find(p=>p.id===d.projectId)?.phase||'nutzung')==='nutzung';
function serviceState(d){
  const n=inUse(d)?nextService(d):null;if(!n)return null;
  const diff=(n-Date.now())/864e5;
  return diff<0?'due':diff<=30?'soon':'ok';
}

/* ---------- Dringlichkeit (automatische Reihenfolge) ---------- */
// Kalendertage von heute bis Datum (YYYY-MM-DD oder Date), negativ = überfällig
function daysUntil(v){
  const s=v instanceof Date?v.toISOString().slice(0,10):v;
  const t=new Date(s+'T12:00:00'),n=new Date();n.setHours(12,0,0,0);
  return Math.round((t-n)/864e5);
}
const relDays=n=>n===0?'heute':n===1?'morgen':n===-1?'seit gestern':n<0?`seit ${-n} Tagen`:`in ${n} Tagen`;
const isOpen=d=>d.status!=='erledigt';
function urgency(d){
  const open=isOpen(d);
  const fd=open&&d.due?daysUntil(d.due):null;            // Frist zählt nur, solange die Tür nicht erledigt ist
  const ns=inUse(d)?nextService(d):null,sd=ns?daysUntil(ns):null; // Wartung zählt nur in der Nutzungsphase
  const dates=[fd,sd].filter(x=>x!=null),near=dates.length?Math.min(...dates):null;
  const pr=open?(PRIO_RANK[d.prio]??2):3;
  let tier;
  if(near!=null&&near<0)tier=0;                            // Frist oder Wartung überfällig
  else if(open&&d.prio==='Dringend')tier=1;                // dringend markiert
  else if((fd!=null&&fd<=14)||(sd!=null&&sd<=30))tier=2;   // Termin steht kurz bevor
  else if(open&&d.prio==='Hoch')tier=3;
  else if(d.status==='offen')tier=4;                       // offener Mangel
  else if(open&&near!=null)tier=5;                         // Termin vor keinem Termin
  else if(open)tier=6;
  else tier=near!=null?7:8;                                // erledigt ans Ende
  if(inUse(d)&&d.condition==='Mangelhaft')tier=Math.min(tier,4);       // Zustand zählt in der Nutzung
  else if(inUse(d)&&d.condition==='Pflegebedürftig')tier=Math.min(tier,5);
  return {tier,pr,near,fd,sd};
}
const STATUS_URG={offen:0,pruefung:1,geplant:2,erledigt:3};
function byUrgency(a,b){
  const ua=urgency(a),ub=urgency(b);
  return ua.tier-ub.tier||ua.pr-ub.pr||(ua.near??Infinity)-(ub.near??Infinity)||STATUS_URG[a.status]-STATUS_URG[b.status]||byNr(a,b);
}
function urgentBadges(d){
  const b=[],u=urgency(d);
  if(isOpen(d)&&d.prio==='Dringend')b.push('<span class="badge urgent">Dringend</span>');
  else if(isOpen(d)&&d.prio==='Hoch')b.push('<span class="badge high">Priorität hoch</span>');
  if(u.fd!=null)b.push(u.fd<0?`<span class="badge due">Frist überfällig</span>`:u.fd<=14?`<span class="badge soon">Frist ${relDays(u.fd)}</span>`:`<span class="badge">Frist ${fmtDate(d.due)}</span>`);
  return b;
}
// Bestehende Daten (ohne Aufgabenfelder) weiter laden
function migrate(st){
  st.projects.forEach(p=>{if(!PHASES[p.phase])p.phase='nutzung';});
  st.doors.forEach(d=>{if(!PRIOS.includes(d.prio))d.prio='Normal';if(d.due==null)d.due='';if(d.task==null)d.task='';if(!Array.isArray(d.history))d.history=[];if(!Array.isArray(d.parts))d.parts=[];if(!Array.isArray(d.files))d.files=[];if(d.condition==null)d.condition='';});
  if(!Array.isArray(st.docs))st.docs=[];if(!Array.isArray(st.items))st.items=[];
  st.docs.forEach(x=>{if(!Array.isArray(x.doorIds))x.doorIds=[];if(!Array.isArray(x.itemIds))x.itemIds=[];if(!DOC_CAT[x.cat])x.cat='sonstiges';});
  st.items.forEach(i=>{if(!Array.isArray(i.doorIds))i.doorIds=[];});
  st.projects.forEach(p=>{if(!Array.isArray(p.gridCols))p.gridCols=[];});
  // Ältere Demo-Daten bekommen einmalig Beispiel-Dokumente und Anbauteile
  if((st.v||0)<5&&!st.docs.length&&!st.items.length)seedDocs(st);
  st.v=5;return st;
}

/* ---------- Demo-Grundriss (SVG) ---------- */
// Maßstab: 1 px = 2 cm (M 1:100 auf dem Plan). Räume oben/unten am Flur, Türen in der Flurwand.
function demoPlan(title,top,bottom){
  const W=1200,H=800,x0=60,x1=1140,yT=60,yC1=360,yC2=440,yB=740;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#fff"/>`;
  s+=`<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#eef0ee" stroke-width="1"/></pattern></defs><rect x="${x0}" y="${yT}" width="${x1-x0}" height="${yB-yT}" fill="url(#g)"/>`;
  s+=`<rect x="${x0}" y="${yC1}" width="${x1-x0}" height="${yC2-yC1}" fill="#f4f6f5"/>`;
  const doors=[];
  const row=(names,yA,yZ,wallY,dir)=>{
    const w=(x1-x0)/names.length;
    names.forEach((n,i)=>{
      const a=x0+i*w,cx=a+w/2;
      if(i>0)s+=`<line x1="${a}" y1="${yA}" x2="${a}" y2="${yZ}" stroke="#1E2422" stroke-width="6"/>`;
      const area=((w*0.02)*((yZ-yA)*0.02)).toFixed(1).replace('.',',');
      s+=`<text x="${cx}" y="${(yA+yZ)/2-4}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1E2422">${esc(n)}</text>`;
      s+=`<text x="${cx}" y="${(yA+yZ)/2+20}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6B7570">${area} m²</text>`;
      doors.push({x:cx/W*100,y:wallY/H*100,room:n});
    });
  };
  row(top,yT,yC1,yC1,-1);row(bottom,yC2,yB,yC2,1);
  s+=`<line x1="${x0}" y1="${yC1}" x2="${x1}" y2="${yC1}" stroke="#1E2422" stroke-width="6"/><line x1="${x0}" y1="${yC2}" x2="${x1}" y2="${yC2}" stroke="#1E2422" stroke-width="6"/>`;
  s+=`<rect x="${x0}" y="${yT}" width="${x1-x0}" height="${yB-yT}" fill="none" stroke="#1E2422" stroke-width="12"/>`;
  // Türöffnungen mit Aufschlag
  const gap=(cx,wy,dir)=>{
    s+=`<rect x="${cx-26}" y="${wy-8}" width="52" height="16" fill="#fff"/>`;
    const ly=wy+dir*50;
    s+=`<line x1="${cx-25}" y1="${wy}" x2="${cx-25}" y2="${ly}" stroke="#1E2422" stroke-width="3"/>`;
    s+=`<path d="M${cx+25} ${wy} A50 50 0 0 ${dir<0?0:1} ${cx-25} ${ly}" fill="none" stroke="#1E2422" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  };
  top.forEach((n,i)=>{const w=(x1-x0)/top.length;gap(x0+i*w+w/2,yC1,-1)});
  bottom.forEach((n,i)=>{const w=(x1-x0)/bottom.length;gap(x0+i*w+w/2,yC2,1)});
  // Eingang links am Flurende
  s+=`<rect x="${x0-8}" y="${(yC1+yC2)/2-30}" width="16" height="60" fill="#fff"/><line x1="${x0}" y1="${(yC1+yC2)/2-30}" x2="${x0+56}" y2="${(yC1+yC2)/2-30}" stroke="#1E2422" stroke-width="3"/><line x1="${x0}" y1="${(yC1+yC2)/2+30}" x2="${x0+56}" y2="${(yC1+yC2)/2+30}" stroke="#1E2422" stroke-width="3"/>`;
  doors.unshift({x:x0/W*100,y:(yC1+yC2)/2/H*100,room:'Flur / Eingang'});
  s+=`<text x="${(x0+x1)/2}" y="${(yC1+yC2)/2+6}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="3" fill="#9aa39f">FLUR</text>`;
  // Plankopf
  s+=`<rect x="${x1-300}" y="${yB+12}" width="300" height="40" fill="#fff" stroke="#1E2422" stroke-width="1.5"/><text x="${x1-288}" y="${yB+38}" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1E2422">${esc(title)}</text><text x="${x1-12}" y="${yB+38}" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6B7570">M 1:100</text>`;
  s+=`<g transform="translate(${x0+20},${yB+32})"><path d="M0 0l10-24 10 24-10-6z" fill="#1E2422"/><text x="10" y="18" text-anchor="middle" font-family="Arial" font-size="12" fill="#1E2422">N</text></g>`;
  s+='</svg>';
  return {src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s),w:W,h:H,doors};
}

/* ---------- Speicher (IndexedDB, Fallback: nur im Arbeitsspeicher) ---------- */
const store={
  db:null,
  async open(){
    if(!('indexedDB' in window))return null;
    return new Promise(res=>{
      try{
        const r=indexedDB.open('doorku',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>{this.db=r.result;res(this.db)};
        r.onerror=()=>res(null);r.onblocked=()=>res(null);
      }catch(e){res(null)}
    });
  },
  async get(k){
    if(!this.db)return null;
    return new Promise(res=>{try{const r=this.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result??null);r.onerror=()=>res(null)}catch(e){res(null)}});
  },
  async set(k,v){
    if(!this.db)return false;
    return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}});
  }
};

function setDoorField(d,k,raw,quiet){

// Anbauteile einer Kategorie für eine Tür setzen. Mehrere mit „;“ trennen. Unbekannte Namen werden als neues Objekt angelegt.
function setDoorItems(d,cat,raw){

  const cur=itemsOfDoor(d).filter(i=>i.cat===cat),low=names.map(n=>n.toLowerCase());

  const U=new Map(all.map(d=>[d.id,urgency(d)]));

  const sideFor=(n,date)=>`<span class="side ${n<0?'late':n<=14?'near':''}">${n<0?'überfällig':esc(relDays(n))}<span class="d num">${fmtDate(date)}</span></span>`;

  const defects=all.filter(d=>d.status==='offen').length;
  const urgent=all.filter(d=>isOpen(d)&&d.prio==='Dringend').length;
  const kpi=(v,l,cls)=>`<div class="kpi ${v?cls:'ok'}"><div class="v">${v}</div><div class="l">${l}</div></div>`;

  // Jetzt angehen: alles bis „offener Mangel“, in automatischer Reihenfolge
  const focus=all.filter(d=>U.get(d.id).tier<=4).sort(byUrgency).map(d=>{
    const u=U.get(d.id),bs=urgentBadges(d);

  });

  // Wartungen: überfällig und in den nächsten 60 Tagen
  const maint=all.filter(d=>{const u=U.get(d.id);return u.sd!=null&&u.sd<=60;}).sort((a,b)=>U.get(a.id).sd-U.get(b.id).sd||byNr(a,b))
    .map(d=>item(d,sideFor(U.get(d.id).sd,nextService(d).toISOString()),d.fire&&d.fire!=='ohne'?d.fire:''));

  // Fristen offener Aufgaben
  const dues=all.filter(d=>U.get(d.id).fd!=null).sort((a,b)=>U.get(a.id).fd-U.get(b.id).fd||byUrgency(a,b))
    .map(d=>item(d,sideFor(U.get(d.id).fd,d.due),d.task||(d.prio!=='Normal'?'Priorität '+d.prio:'')));

  // Projekte
  const projs=projects.map(p=>{
    const ds=all.filter(d=>d.projectId===p.id),done=ds.filter(d=>d.status==='erledigt').length;
    const late=ds.filter(d=>U.get(d.id).near!=null&&U.get(d.id).near<0).length,off=ds.filter(d=>d.status==='offen').length,urg=ds.filter(d=>isOpen(d)&&d.prio==='Dringend').length;
    let metric,ratio;
    if(p.phase==='planung'){const c=ds.filter(d=>completeness(d).n===PLAN_KEYS.length).length;metric=`${c} von ${ds.length} Türen vollständig beschrieben`;ratio=ds.length?c/ds.length:0;}
    else if(p.phase==='bau'){const ps=ds.flatMap(d=>d.parts||[]),m=ps.filter(x=>x.state==='montiert').length;metric=ps.length?`${m} von ${ps.length} Teilen montiert`:'Noch keine Teilelisten';ratio=ps.length?m/ps.length:0;}
    else{const okc=ds.filter(d=>serviceState(d)!=='due'&&d.condition!=='Mangelhaft').length,care=ds.filter(d=>d.condition==='Pflegebedürftig'||d.condition==='Mangelhaft').length;metric=`${okc} von ${ds.length} Türen in Ordnung${care?` · ${care} pflegebedürftig`:''}`;ratio=ds.length?okc/ds.length:0;}
    const flags=[late?`<span class="badge due">${late} überfällig</span>`:'',urg?`<span class="badge urgent">${urg} dringend</span>`:'',off?`<span class="badge">${off} ${off===1?'Mangel':'Mängel'}</span>`:''].join('');
    return `<button class="pcard" data-act="goProject" data-id="${p.id}"><span class="r1"><span class="projicon">${esc(initials(p.name))}</span><span style="flex:1;min-width:0">${esc(p.name)}<br><span class="r2">${esc(p.place||'')}</span></span><span class="tag ph-${p.phase}">${PHASES[p.phase]}</span></span>
      <span class="r2 num">${ds.length} ${ds.length===1?'Tür':'Türen'} · ${esc(metric)}</span><span class="bar"><i style="width:${Math.round(ratio*100)}%"></i></span>${flags?`<span class="badges" style="margin-top:0">${flags}</span>`:''}</button>`;
  }).join('');

  // Letzte Aktivität
  const acts=all.flatMap(d=>d.history.slice(0,3).map(h=>({d,h}))).sort((a,b)=>a.h.ts<b.h.ts?1:-1)
    .map(({d,h})=>`<button class="ditem" data-act="openAny" data-id="${d.id}"><span class="t1"><span class="nr">${esc(d.nr)}</span>${esc(h.text)}</span><span class="t2">${esc(fmtDateTime(h.ts))} · ${esc(h.user)} · ${esc(pname(d.projectId))}</span></button>`);

  const today=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return `<div class="dash">
    <div class="dtitle"><h2>Übersicht</h2><div class="sub">${esc(today)} · ${projects.length} ${projects.length===1?'Projekt':'Projekte'} · ${all.length} ${all.length===1?'Tür':'Türen'}</div></div>
    <div class="chips">${phaseChips}</div>
    <div class="kpis">${kpi(overdue,'Überfällig','alert')}${kpi(urgent,'Dringend','alert')}${kpi(soon,'Bald fällig','warn')}${kpi(defects,'Offene Mängel','warn')}</div>
    <div class="dgrid">
      ${panel('Jetzt angehen',focus,8,'Nichts Dringendes. Alle Fristen und Wartungen sind im grünen Bereich.','full')}
      ${panel('Anstehende Wartungen',maint,6,projects.some(p=>p.phase==='nutzung')?'Keine Wartung in den nächsten 60 Tagen.':'Wartungen werden erst in der Phase „Nutzung“ überwacht.')}
      ${panel('Fristen',dues,6,'Keine offenen Aufgaben mit Frist.')}
      <section class="panel full"><h3>Projekte</h3>${projs?`<div class="projcards">${projs}</div>`:`<div class="pempty">${S.projects.length?'Kein Projekt in dieser Phase.':'Noch keine Projekte.'}</div>`}</section>
      ${panel('Letzte Aktivität',acts.slice(0,6),6,'Noch keine Einträge.','full')}
    </div></div>`;
}

/* Türliste */
function filteredDoors(){
  const q=ui.q.trim().toLowerCase();
  return doorsOf().filter(d=>(ui.status==='alle'||d.status===ui.status)&&(!q||[d.nr,d.name,d.room,d.floor,d.type,d.fire,d.maker,d.task].join(' ').toLowerCase().includes(q))).sort(ui.sort==='nr'?byNr:byUrgency);
}
function listView(){
  return `<div class="view" id="listScroll"><div class="toolbar">
    <label class="search">${ICON.search}<input id="q" type="search" placeholder="Tür-Nr., Raum, Typ, Brandschutz …" value="${esc(ui.q)}" autocomplete="off" aria-label="Türen durchsuchen"></label>
    <div class="chips" id="statusChips">${statusChips()}</div>
    <div class="sortrow">Reihenfolge<div class="seg small" role="group" aria-label="Reihenfolge">${[['prio','Dringlichkeit'],['nr','Tür-Nr.']].map(([k,l])=>`<button data-act="listSort" data-k="${k}" aria-pressed="${ui.sort===k}">${l}</button>`).join('')}</div><span class="spacer"></span><button class="btn ghost" data-act="toGrid" style="height:30px;padding:0 8px;font-size:13px">${ICON.table}Als Tabelle erfassen</button></div>
  </div><div class="cards" id="cards">${cardsHtml()}</div></div>
  <button class="fab" data-act="newDoorList" aria-label="Neue Tür anlegen">${ICON.plus}<span>Tür</span></button>`;
}
function statusChips(){
  const all=doorsOf();
  return ['alle',...STATUS_ORDER].map(k=>{
    const n=k==='alle'?all.length:all.filter(d=>d.status===k).length;
    return `<button class="chip" data-act="status" data-k="${k}" aria-pressed="${ui.status===k}">${k==='alle'?'Alle':STATUS[k]} <span class="cnt num">${n}</span></button>`;
  }).join('');
}
function badgesHtml(d){
  const b=urgentBadges(d),ph=phase();
  if(ph==='planung'){const c=completeness(d);if(c.n<c.of)b.push(`<span class="badge low">Angaben ${c.n}/${c.of}</span>`);if(d.files?.length)b.push(`<span class="badge">${d.files.length} ${d.files.length===1?'Zeichnung':'Zeichnungen'}</span>`);}
  if(ph==='bau'){const ps=d.parts||[],m=ps.filter(x=>x.state==='montiert').length;b.push(ps.length?`<span class="badge ${m===ps.length?'':'soon'}">Teile ${m}/${ps.length} montiert</span>`:'<span class="badge low">keine Teileliste</span>');}
  if(ph==='nutzung'&&condBadge(d))b.push(condBadge(d));
  if(d.fire&&d.fire!=='ohne')b.push(`<span class="badge fire">${esc(d.fire)}</span>`);
  const s=serviceState(d);
  if(s==='due')b.push('<span class="badge due">Wartung fällig</span>');
  else if(s==='soon')b.push('<span class="badge soon">Wartung bald fällig</span>');
  if(!d.planId&&ph!=='nutzung')b.push('<span class="badge nopin">nicht im Plan</span>');
  return b.length?`<div class="badges">${b.join('')}</div>`:'';
}
function cardsHtml(){
  const list=filteredDoors();
  if(!list.length){
    return doorsOf().length?`<div class="empty"><h3>Keine Treffer</h3>Passe Suche oder Statusfilter an.</div>`
      :`<div class="empty"><h3>Noch keine Türen im Projekt</h3>Lege eine Tür über „+ Tür“ an oder platziere sie direkt im Plan.</div>`;

  return list.map(d=>`<button class="card" data-act="open" data-id="${d.id}" ${isWide()&&ui.doorId===d.id?'aria-current="true"':''}>

    <div class="card-title">${esc(d.name||'Ohne Bezeichnung')}</div>

    ${d.task&&isOpen(d)?`<div class="card-meta" style="color:var(--ink)">${esc(d.task)}</div>`:''}
    ${badgesHtml(d)}</button>`).join('');
}
function refreshList(){const c=$('#cards');if(c)c.innerHTML=cardsHtml();const sc=$('#statusChips');if(sc)sc.innerHTML=statusChips();}

  </div>

function taskBlock(d){

async function docViewer(x){
  const pdf=x.mime==='application/pdf';
  openSheet(`<h2>${esc(x.name)}</h2><p class="sub">${esc([DOC_CAT[x.cat],x.nr,x.pages>1?x.pages+' Seiten':''].filter(Boolean).join(' · '))}${x.demo?' · Demo-Dokument ohne echte Datei':''}</p>
    <div class="fileview" id="docPages">${pdf?'<p class="muted" style="padding:12px">PDF wird geladen …</p>':`<img src="${x.src}" alt="${esc(x.name)}">`}</div>
    <div class="btnrow" style="margin-top:12px"><button class="btn" data-act="openDoc" data-id="${x.id}">${ICON.back}Zurück</button><button class="btn" data-act="dlDoc" data-id="${x.id}">Herunterladen</button></div>`,'Dokument ansehen');
  if(!pdf)return;
  const box=$('#docPages');
  try{
    const lib=await loadPdfJs();
    const bin=atob(x.src.slice(x.src.indexOf(',')+1)),bytes=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)bytes[k]=bin.charCodeAt(k);
    const doc=await lib.getDocument({data:bytes}).promise;
    const W=Math.min(1600,(box.clientWidth||600)*2);box.innerHTML='';
    for(let i=1;i<=Math.min(doc.numPages,40);i++){
      if(!box.isConnected)return;
      const page=await doc.getPage(i),v1=page.getViewport({scale:1}),vp=page.getViewport({scale:W/v1.width});
      const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);cv.style.cssText='display:block;width:100%;height:auto;background:#fff;margin-bottom:8px';
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;box.appendChild(cv);
    }
    if(doc.numPages>40)box.insertAdjacentHTML('beforeend','<p class="muted" style="padding:8px">Vorschau zeigt die ersten 40 Seiten. Herunterladen für das ganze Dokument.</p>');

}

/* Nutzung: Wartungen und Zustand */
function maintView(){
  const ds=doorsOf(),late=[],soon=[],later=[],none=[];
  ds.forEach(d=>{const n=nextService(d);if(!n)none.push(d);else{const k=daysUntil(n);(k<0?late:k<=30?soon:later).push(d);}});
  const byNext=(a,b)=>nextService(a)-nextService(b)||byNr(a,b);
  const care=ds.filter(d=>d.condition==='Pflegebedürftig'||d.condition==='Mangelhaft').sort((a,b)=>CONDS.indexOf(b.condition)-CONDS.indexOf(a.condition)||byNr(a,b));
  const row=d=>{const n=nextService(d),k=n?daysUntil(n):null;
    return `<div class="mrow"><button class="mt" data-act="open" data-id="${d.id}"><span class="t1"><span class="nr">${esc(d.nr)}</span> ${esc(d.name||'Ohne Bezeichnung')}</span><span class="t2">${esc([d.floor,d.room].filter(Boolean).join(' · '))}${d.fire&&d.fire!=='ohne'?` · ${esc(d.fire)}`:''}${n?` · ${k<0?'überfällig '+relDays(k):relDays(k)} (${fmtDate(n.toISOString())})`:' · keine Wartungsdaten'}</span>${condBadge(d)?`<span class="badges">${condBadge(d)}</span>`:''}</button><button class="btn ${k!=null&&k<0?'primary':''}" data-act="serviceDoor" data-id="${d.id}">${ICON.wrench}<span class="hide-s">Erfassen</span></button></div>`;};
  const grp=(t,list,cls,empty)=>list.length||empty?`<section class="panel"><h3>${t}<span class="cnt num">${list.length||''}</span></h3>${list.length?list.map(row).join(''):`<div class="pempty">${empty}</div>`}</section>`:'';
  const kpi=(v,l,cls)=>`<div class="kpi ${v?cls:'ok'}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  return `<div class="dash" style="max-width:900px;margin:0">
    <div class="kpis">${kpi(late.length,'Wartung überfällig','alert')}${kpi(soon.length,'In 30 Tagen fällig','warn')}${kpi(care.length,'Pflegebedürftig / Mangel','warn')}${kpi(none.length,'Ohne Wartungsdaten','warn')}</div>
    ${grp('Überfällig',late.sort(byNext),'',  'Keine Wartung überfällig.')}
    ${grp('In den nächsten 30 Tagen',soon.sort(byNext),'','Keine Wartung in den nächsten 30 Tagen.')}
    ${grp('Zustand auffällig',care,'')}
    ${grp('Später',later.sort(byNext),'')}
    ${grp('Ohne Wartungsdaten',none.sort(byNr),'')}
  </div>`;
}

/* Tabelle */
function tableRows(){
  const t=ui.t,q=t.q.trim().toLowerCase();
  const list=doorsOf().filter(d=>(!t.status||d.status===t.status)&&(!t.floor||d.floor===t.floor)&&(!t.fire||d.fire===t.fire)&&(!q||[d.nr,d.name,d.room,d.floor,d.type,d.fire,d.maker,d.hardware,d.task].join(' ').toLowerCase().includes(q)));
  const key=t.sort;
  list.sort((a,b)=>{
    let va,vb;
    if(key==='prio')return byUrgency(a,b)*t.dir;
    if(key==='due'){va=a.due&&isOpen(a)?a.due:'9999';vb=b.due&&isOpen(b)?b.due:'9999';return va.localeCompare(vb)*t.dir||byUrgency(a,b);}
    if(key==='next'){va=nextService(a)?.getTime()??Infinity;vb=nextService(b)?.getTime()??Infinity;return (va-vb)*t.dir;}
    if(key==='status'){va=STATUS_ORDER.indexOf(a.status);vb=STATUS_ORDER.indexOf(b.status);return (va-vb)*t.dir;}
    if(key==='docs')return (docsOfDoor(a).length-docsOfDoor(b).length)*t.dir||byNr(a,b);
    return String(a[key]??'').localeCompare(String(b[key]??''),'de',{numeric:true})*t.dir;
  });
  return list;
}
const TCOLS=[['prio','Priorität'],['nr','Tür-Nr.'],['name','Bezeichnung'],['floor','Geschoss'],['room','Raum'],['type','Türtyp'],['fire','Brandschutz'],['status','Status'],['due','Frist'],['next','Nächste Wartung'],['docs','Dokumentation']];
const tmodeBar=()=>`<div class="sortrow">Tabelle<div class="seg small" role="group" aria-label="Tabellenmodus">${[['view','Ansehen'],['grid','Erfassen']].map(([k,l])=>`<button data-act="tmode" data-k="${k}" aria-pressed="${ui.tmode===k}">${l}</button>`).join('')}</div></div>`;
function tableView(){
  if(ui.tmode==='grid')return gridView();
  const all=doorsOf(),t=ui.t;
  const floors=[...new Set(all.map(d=>d.floor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de',{numeric:true}));
  const sel=(id,label,val,opts)=>`<select id="${id}" aria-label="${label}"><option value="">${label}: alle</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  return `<div class="toolbar">${tmodeBar()}<label class="search">${ICON.search}<input id="tq" type="search" placeholder="In Tabelle suchen …" value="${esc(t.q)}" autocomplete="off" aria-label="Tabelle durchsuchen"></label>
    <div class="tfilters">${sel('tStatus','Status',t.status,STATUS_ORDER.map(k=>[k,STATUS[k]]))}${sel('tFloor','Geschoss',t.floor,floors.map(f=>[f,f]))}${sel('tFire','Brandschutz',t.fire,FIRE.map(f=>[f,f]))}
    <span class="count num" id="tCount"></span><button class="btn" data-act="csv">CSV exportieren</button></div></div>
    <div class="tablewrap"><div class="tscroll"><table><thead><tr>${TCOLS.map(([k,l])=>`<th><button data-act="sort" data-k="${k}" ${t.sort===k?`data-dir="${t.dir>0?'↑':'↓'}"`:''}>${l}</button></th>`).join('')}</tr></thead><tbody id="tbody"></tbody></table></div></div>`;
}

    <div id="bulkbar">${bulkHtml()}</div>
    <p class="editing-note" style="margin:0">Wird sofort gespeichert und protokolliert. Enter springt eine Zeile tiefer. In Anbauteil-Spalten Produkt eintragen, z. B. „GEZE TS 5000“: Neues wird als Objekt angelegt, Bekanntes zugeordnet, mehrere mit „;“ trennen. Zeilen aus Excel lassen sich direkt einfügen.</p></div>
    <div class="tablewrap grid"><div class="tscroll"><table><thead><tr><th class="cb"><input type="checkbox" id="gridAll" aria-label="Alle auswählen" ${ds.length&&ds.every(d=>ui.sel.has(d.id))?'checked':''}></th>${GRID_F.map(k=>`<th>${esc(F(k).l)}</th>`).join('')}${cats.map(c=>`<th class="item">${esc(c)}</th>`).join('')}<th>Dokumente</th></tr></thead>

  const v={nr,name:'',floor:p?p.name:'',room:'',type:TYPES[0],fire:'ohne',task:'',prio:'Normal',due:''};
  const f=['nr','name','floor','room','type','fire','task','prio','due'].map(k=>FIELDS.find(x=>x.k===k));

function suggestNr(p){
  const tag=p?p.name.replace(/\./g,'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,4):'';
  const prefix=tag?`T-${tag}-`:'T-';
  let max=0;doorsOf().forEach(d=>{if(String(d.nr).startsWith(prefix)){const m=String(d.nr).slice(prefix.length).match(/^(\d+)/);if(m)max=Math.max(max,+m[1]);}});
  return prefix+String(max+1).padStart(2,'0');
}

function download(content,name,type){
  try{
    const url=URL.createObjectURL(new Blob([content],{type}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast(`${name} wird gespeichert`);
  }catch(e){toast('Download ist hier nicht möglich');}
}
function setZoom(z){
  const vp=$('#vp');const old=ui.zoom;ui.zoom=Math.min(5,Math.max(1,z));
  const c=$('#canvas');if(!c||!vp)return;
  const cx=(vp.scrollLeft+vp.clientWidth/2)/vp.scrollWidth,cy=(vp.scrollTop+vp.clientHeight/2)/vp.scrollHeight;
  c.style.width=`calc(${ui.zoom*100}% - 32px)`;
  vp.scrollLeft=cx*vp.scrollWidth-vp.clientWidth/2;vp.scrollTop=cy*vp.scrollHeight-vp.clientHeight/2;
  if(old===ui.zoom&&z>old)toast('Maximale Vergrößerung');
}
function centerOn(d){
  requestAnimationFrame(()=>{const vp=$('#vp'),c=$('#canvas');if(!vp||!c)return;
    vp.scrollLeft=c.offsetLeft+c.offsetWidth*d.x/100-vp.clientWidth/2;vp.scrollTop=c.offsetTop+c.offsetHeight*d.y/100-vp.clientHeight/2;});
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&A[el.dataset.act]){e.preventDefault();A[el.dataset.act](el,e);return;}
  const c=e.target.closest('#canvas');
  if(c&&ui.placing){
    const r=c.getBoundingClientRect();
    const x=Math.round((e.clientX-r.left)/r.width*1000)/10,y=Math.round((e.clientY-r.top)/r.height*1000)/10;
    const p=currentPlan();if(!p)return;
    if(ui.placing.doorId){

document.addEventListener('paste',e=>{
  const t=e.target;if(!t.closest?.('.grid td')||t.type==='checkbox')return;
  const txt=(e.clipboardData?.getData('text/plain')||'').replace(/\r/g,'').replace(/\n+$/,'');
  if(!/[\t\n]/.test(txt))return;
  e.preventDefault();
  const cols=[...GRID_F.map(k=>({k})),...gridCats().map(c=>({cat:c}))];
  const td=t.closest('td'),tr=td.closest('tr'),ci=[...tr.children].indexOf(td)-1,ds=gridDoors();
  let ri=ds.findIndex(d=>d.id===tr.dataset.door),made=0,rows=0,newItems=0;if(ri<0)ri=ds.length;
  txt.split('\n').forEach((line,r)=>{
    const cells=line.split('\t');if(!cells.some(c=>c.trim()))return;
    let d=ds[ri+r],fresh=false;
    if(!d){d=newDoorObj({nr:suggestNr(null)});d.history.push({ts:new Date().toISOString(),user:me().name,kind:'create',text:'Tür angelegt aus eingefügter Tabelle'});S.doors.push(d);made++;fresh=true;}
    cells.forEach((v,j)=>{const c=cols[ci+j];if(!c)return;if(c.k){if(c.k==='nr'&&!v.trim())return;setDoorField(d,c.k,v,fresh);}else newItems+=setDoorItems(d,c.cat,v).created.length;});
    rows++;
  });
  save();render();toast(`${rows} ${rows===1?'Zeile':'Zeilen'} übernommen${made?`, ${made} ${made===1?'Tür':'Türen'} neu`:''}${newItems?`, ${newItems} Anbauteile neu`:''}`,3600);
});

/* ---------- Plan-Upload (PDF.js lokal unter vendor/) ---------- */
let pdfjsReady=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfjsReady)return pdfjsReady;
  pdfjsReady=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src='vendor/pdf.min.js';
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';res(window.pdfjsLib)}catch(e){rej(e)}};
    s.onerror=()=>{pdfjsReady=null;rej(new Error('PDF.js konnte nicht geladen werden'))};
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
async function pdfToPlans(file){
  const lib=await loadPdfJs();
  const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const n=Math.min(pdf.numPages,20),out=[];
  const base=file.name.replace(/\.pdf$/i,'');
  for(let i=1;i<=n;i++){
    toast(`PDF wird verarbeitet: Seite ${i} von ${n}`,0);
    const page=await pdf.getPage(i);
    const v1=page.getViewport({scale:1});
    const scale=Math.min(4,2400/Math.max(v1.width,v1.height));
    const vp=page.getViewport({scale});
    const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    out.push({name:n>1?`${base} · S. ${i}`:base,src:cv.toDataURL('image/jpeg',.86),w:cv.width,h:cv.height});
  }
  if(pdf.numPages>20)toast('Nur die ersten 20 Seiten wurden übernommen',4000);
  return out;
}
function imageToPlan(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>res([{name:file.name.replace(/\.[^.]+$/,''),src:r.result,w:img.naturalWidth,h:img.naturalHeight}]);img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

/* Dokument-Upload: Originaldatei bleibt erhalten, dazu eine kleine Vorschau der ersten Seite */
const isPdfFile=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
function readDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
async function makeThumb(file,src){
  const cv=document.createElement('canvas'),W=420;let pages=1;
  if(isPdfFile(file)){
    const lib=await loadPdfJs(),pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;pages=pdf.numPages;
    const page=await pdf.getPage(1),v1=page.getViewport({scale:1}),vp=page.getViewport({scale:W/v1.width});
    cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
  }else{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
    const sc=W/(img.naturalWidth||W);cv.width=W;cv.height=Math.max(1,Math.round((img.naturalHeight||W*1.4)*sc));
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
  }
  return {thumb:cv.toDataURL('image/jpeg',.8),pages};
}
async function submitNewDoc(){
  const file=$('#nd2_file')?.files[0];if(!file){toast('Bitte eine Datei wählen');return;}
  if(file.size>25e6){toast('Die Datei ist größer als 25 MB',4000);return;}
  const pre=sheetState.newDoc||{},cat=$('#nd2_cat').value,name=$('#nd2_name').value.trim()||file.name.replace(/\.[^.]+$/,''),nr=$('#nd2_nr').value.trim(),valid=$('#nd2_valid').value;
  toast('Dokument wird gelesen …',0);
  try{
    const src=await readDataUrl(file),{thumb,pages}=await makeThumb(file,src);
    const x={id:uid(),projectId:proj().id,cat,name,nr,valid,src,thumb,mime:isPdfFile(file)?'application/pdf':(file.type||'image/*'),fileName:file.name,pages,size:file.size,created:new Date().toISOString(),user:me().name,doorIds:[],itemIds:[]};
    S.docs.push(x);
    (pre.doorIds||[]).forEach(id=>{const d=door(id);if(d)linkDocDoor(x,d,true);});
    (pre.itemIds||[]).forEach(id=>{const i=itemById(id);if(i)linkDocItem(x,i,true);});
    save();render();sheetState={};docSheet(x);toast('Dokument gespeichert. Jetzt Türen zuordnen.');
  }catch(err){console.error(err);toast(`„${file.name}“ konnte nicht gelesen werden`,4000);}
}
